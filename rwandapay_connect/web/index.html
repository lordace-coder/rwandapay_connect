<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RwandaPay Connect — cross-border remittance from the United States to Rwanda, with Scan to Pay and MTN MoMo cash-out.">
  <meta name="theme-color" content="#1B2A4A">

  <!-- Scan to Pay reads QR codes from the camera, which the browser only
       grants on a secure origin (https, or localhost during development). -->
  <meta http-equiv="Permissions-Policy" content="camera=(self)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RwandaPay Connect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RwandaPay Connect</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F4F5F9;
    }

    /* Shown while the Flutter engine downloads, then removed on first frame.
       Without it the page is blank white for a second or two on load. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: linear-gradient(135deg, #1B2A4A 0%, #2D4470 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 0.35s ease;
      z-index: 9999;
    }

    #boot.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #boot .mark {
      width: 74px;
      height: 74px;
      border-radius: 24px;
      background: #C9A227;
      color: #1B2A4A;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    #boot .name {
      color: #FFFFFF;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    #boot .tagline {
      color: rgba(255, 255, 255, 0.45);
      font-size: 13px;
      margin-top: -14px;
    }

    #boot .bar {
      width: 132px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    #boot .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: #C9A227;
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(330%); }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark">RP</div>
    <div class="name">RwandaPay Connect</div>
    <div class="tagline">United States → Rwanda</div>
    <div class="bar"><span></span></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('hidden');
      setTimeout(function () { boot.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
