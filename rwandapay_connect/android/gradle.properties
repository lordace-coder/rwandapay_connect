# Sized for this machine (7.6 GB RAM, 4 cores). The Flutter template ships
# -Xmx8G, which is more heap than the machine physically has and drives it
# into swap during a build; 2 GB is ample for an app this size.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Reuse the daemon between builds so repeat builds skip JVM startup.
org.gradle.daemon=true

# Only re-run tasks whose inputs changed, and cache their outputs.
org.gradle.caching=true
